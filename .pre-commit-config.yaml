repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.1
    hooks:
      - id: pyupgrade
        args: [ --py38-plus, ]

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        args: [ --remove-all-unused-imports, --in-place, ]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort


  - repo: https://github.com/dosisod/refurb
    rev: v2.0.0
    hooks:
      - id: refurb
        exclude: ^(tests)/
        args: [
          "--ignore", "107",
          "--ignore", "108",
          "--ignore", "109",
          "--ignore", "119",
          "--ignore", "124",
          "--ignore", "183",
          "--ignore", "184",
        ]
